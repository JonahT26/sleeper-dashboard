# Project settings. Code reads these at runtime; never hardcode them.

# Keep the quotes: without them YAML reads the ID as a number.
league_id: "1369887235935059968"
season: 2026
# First day of each NFL season (Sleeper's /state/nfl season_start_date); week 1 transactions
# before it count as preseason. Stored here because /state/nfl only describes the current
# season and rolls over in the off-season. While Sleeper still describes a season, every run
# checks the two agree. Add a line for each new season, and for past seasons (Phase 5).
season_start_dates:
  2026: 2026-09-09

# Metric parameters. Definitions and the reasoning behind each value are in
# docs/METRICS_SPEC.md; change a value there first, with the owner's approval.
metrics:
  efficiency:
    ppts_warn_gap: 5.0    # warn if a team's optimal points exceed Sleeper's max points by more than this (season)
  consistency:
    min_weeks: 3          # volatility, floor, and ceiling are hidden until a team has this many weeks
    floor_pct: 0.10       # floor = this percentile of a team's weekly points
    ceiling_pct: 0.90     # ceiling = this percentile of a team's weekly points
    boom_margin: 20       # boom week: score >= weekly league median + this many points
    bust_margin: 20       # bust week: score <= weekly league median - this many points
  schedule:
    min_weeks: 3          # strength of schedule is hidden until this many weeks are complete
  power:
    weights:              # must sum to 1; every weight is shown on the dashboard
      season_scoring: 0.35   # mean points per week
      recent_form: 0.25      # mean points over the last recent_weeks weeks
      roster_strength: 0.20  # mean optimal points per week
      results: 0.20          # head-to-head win %, regular season
    recent_weeks: 3       # window for recent form
    scale: 15             # component score = 50 + scale * z
    shrink_weeks: 3       # early-season spread is multiplied by n / (n + shrink_weeks); ranking unaffected
  awards:
    enabled:              # awards shown each week, in display order; others defined in the spec can be added
      - top_score
      - lowest_score
      - heartbreaker
      - robbery
      - blowout
      - nail_biter
      - bench_blunder
      - mvp
      - pickup_of_the_week
