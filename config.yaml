# Project settings. Code reads these at runtime; never hardcode them.

# Keep the quotes: without them YAML reads the ID as a number.
league_id: "1369887235935059968"
season: 2026
# Past seasons are rebuilt too, back to this one, by following each league's previous_league_id
# (owner, 2026-10-05: every season Sleeper has, 2020 on). Each needs a season start date below.
history_from: 2020
# First day of each NFL season (Sleeper's /state/nfl season_start_date); week 1 transactions
# before it count as preseason. Stored here because /state/nfl only describes the current
# season and rolls over in the off-season. While Sleeper still describes a season, every run
# checks the two agree. Add a line for each new season. Past seasons use the same rule as Sleeper's 2026
# date, the Wednesday before the NFL's opening game (owner, 2026-10-05).
season_start_dates:
  2020: 2020-09-09
  2021: 2021-09-08
  2022: 2022-09-07
  2023: 2023-09-06
  2024: 2024-09-04
  2025: 2025-09-03
  2026: 2026-09-09

# Known gaps between the sum of Sleeper's weekly scores and its stored season totals (weekly sum minus
# stored total, points). Each is one game whose score Sleeper corrected without updating its season totals;
# records and every weekly score still agree. "Points for/against match Sleeper" allows exactly these, so
# any new or vanished gap still stops the run (owner, 2026-10-05; found when past seasons were added).
sleeper_points_gaps:
  2020:
    - {roster_id: 1, points_for: -2.00}
    - {roster_id: 5, points_against: -2.00}
    - {roster_id: 2, points_for: -21.36}
    - {roster_id: 9, points_against: -21.36}
    - {roster_id: 12, points_for: 17.70}
    - {roster_id: 8, points_against: 17.70}
  2021:
    - {roster_id: 3, points_for: 2.00}
    - {roster_id: 4, points_against: 2.00}
    - {roster_id: 11, points_for: -16.20}
    - {roster_id: 9, points_against: -16.20}
  2023:
    - {roster_id: 5, points_for: 1.00}
    - {roster_id: 8, points_for: -1.00, points_against: 1.00}
    - {roster_id: 10, points_against: -1.00}

# League rulings on a season's final that differ from Sleeper's winners bracket (owner, 2026-10-07). The final's
# winner and loser are swapped in winners_bracket, so History's champions, titles and playoff records follow the
# ruling; Sleeper's scores stay as they are. "Title overrides match Sleeper's bracket" stops the run if Sleeper's
# final no longer shows the result being overridden (e.g. Sleeper fixed it), so the list stays true.
champion_overrides:
  2022: {winner_roster_id: 9, loser_roster_id: 4}  # ShamParker (Sparker79 then) over jsmetz97: league ruling

# The page's freshness warning (docs/UI_GUIDE.md "Status bar"). When the last update is more than
# this many days old on the viewer's clock, the page says which week the rankings are from and
# when the next update is due (the times come from .github/workflows/weekly.yml).
dashboard:
  stale_after_days: 8
  # The published page's address: the link in the chat post and in the page's link-preview tags.
  page_url: https://jonaht26.github.io/sleeper-dashboard/

# The weekly league-chat post (src/sleeper_dash/chat.py; docs/RUNBOOK.md section 7), owner 2026-10-05.
# After each successful update the workflow posts the top 3, the biggest riser and faller, two awards, and the
# link to the league's GroupMe group, at most once per week. mode: "off", "dry-run" (print the message in the
# run's summary, send nothing), or "on". Keep the quotes: YAML reads a bare off/on as false/true.
# The GroupMe bot ID is a GitHub Actions secret (GROUPME_BOT_ID), never written here (CLAUDE.md rule 7).
chat:
  mode: "dry-run"
  awards: [top_score, heartbreaker, blowout, bench_blunder]   # the first two given that week are posted

# Metric parameters. Definitions and the reasoning behind each value are in
# docs/METRICS_SPEC.md; change a value there first, with the owner's approval.
metrics:
  efficiency:
    ppts_warn_gap: 5.0    # warn if a team's optimal points exceed Sleeper's max points by more than this (season)
  consistency:
    min_weeks: 3          # volatility, floor, and ceiling are hidden until a team has this many weeks
    floor_pct: 0.10       # floor = this percentile of a team's weekly points
    ceiling_pct: 0.90     # ceiling = this percentile of a team's weekly points
    boom_margin: 20       # boom week: score >= weekly league median + this many points
    bust_margin: 20       # bust week: score <= weekly league median - this many points
  schedule:
    min_weeks: 3          # strength of schedule is hidden until this many weeks are complete
  power:
    weights:              # must sum to 1; every weight is shown on the dashboard
      season_scoring: 0.35   # mean points per week
      recent_form: 0.25      # mean points over the last recent_weeks weeks
      roster_strength: 0.20  # mean optimal points per week
      results: 0.20          # head-to-head win %, regular season
    recent_weeks: 3       # window for recent form
    scale: 15             # component score = 50 + scale * z
    shrink_weeks: 3       # early-season spread is multiplied by n / (n + shrink_weeks); ranking unaffected
  playoff_odds:
    simulations: 10000    # simulated seasons per week; Monte Carlo error at most 0.5 percentage points
    seed: 2026            # base random seed; each week's seed comes from it, the season, and the week
    shrink_weeks: 6       # k: the prior on a team's strength counts as this many weeks (2025 calibration 6.5)
    min_weeks: 3          # first week with odds (at least 2: the score SD needs two weeks per team)
  transactions:
    min_faab_spend: 10    # FAAB efficiency (points per dollar) is shown once a team has spent at least this many dollars
  awards:
    enabled:              # awards shown each week, in display order; others defined in the spec can be added
      - top_score
      - lowest_score
      - heartbreaker
      - robbery
      - blowout
      - nail_biter
      - bench_blunder
      - mvp
      - pickup_of_the_week
