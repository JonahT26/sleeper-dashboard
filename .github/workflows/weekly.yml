# Weekly refresh: pull the league from Sleeper, recompute everything, check it, and
# publish the dashboard to GitHub Pages. Any failed step stops the run before
# publishing, so the last good page stays live (CLAUDE.md rule 8).
name: Weekly refresh

on:
  schedule:
    # Tuesday 12:17 PM Eastern, after Monday night's game is scored.
    - cron: "17 12 * * 2"
      timezone: "America/New_York"
    # Thursday 12:17 PM Eastern, to pick up the week's stat corrections.
    - cron: "17 12 * * 4"
      timezone: "America/New_York"
  workflow_dispatch: # "Run workflow" button on the Actions tab

# One run at a time; a second trigger waits for the first to finish.
concurrency:
  group: weekly-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # commit the refreshed data/processed/ tables
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version # exact version, the same as local (3.14.7)
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install
        id: install
        run: |
          pip install -r requirements-ci.txt
          pip install --no-deps -e .

      - name: Tests (committed tables)
        id: tests
        run: pytest -q

      # Also writes the run summary (latest week, checks passed, tables written) to the run's page.
      - name: Pipeline (Sleeper → checks → tables)
        id: pipeline
        run: python -m sleeper_dash.pipeline

      - name: Dashboard
        id: dashboard
        run: python -m sleeper_dash.dashboard

      # Also checks the built site/: the link-preview tags and image name this run's latest week.
      - name: Page tests (this run's tables)
        id: page_tests
        env:
          CHECK_BUILT_SITE: "1"
        run: pytest -q tests/test_page.py tests/test_site.py

      - name: Commit refreshed tables
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/*.csv
          if git diff --cached --quiet; then
            echo "Processed tables unchanged; nothing to commit."
            echo "**Commit:** processed tables unchanged; nothing committed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          week=$(python -c "import json; print(max(json.load(open('data/cache/pipeline_run.json'))['weeks']))")
          git commit -m "Weekly refresh: tables through week $week"
          git pull --rebase
          git push
          echo "**Commit:** \"Weekly refresh: tables through week $week\" pushed to main." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 90 # keep each published page so rollback.yml can put it back (the default is 1 day)

      # Always runs, so a failed run says where it stopped at the top of its page.
      - name: Run summary
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          PIPELINE: ${{ steps.pipeline.outcome }}
          DASHBOARD: ${{ steps.dashboard.outcome }}
          PAGE_TESTS: ${{ steps.page_tests.outcome }}
          COMMIT: ${{ steps.commit.outcome }}
          STATUS: ${{ job.status }}
        run: |
          {
            if [ "$STATUS" = "success" ]; then
              echo "## Build: passed. The page is published next (deploy job)."
            else
              echo "## Build: FAILED. Nothing was published; the last good page stays live."
              echo
              echo "Open the first failed step's log below for the reason."
            fi
            echo
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| Install | ${INSTALL:-not run} |"
            echo "| Tests (committed tables) | ${TESTS:-not run} |"
            echo "| Pipeline (Sleeper → checks → tables) | ${PIPELINE:-not run} |"
            echo "| Dashboard | ${DASHBOARD:-not run} |"
            echo "| Page tests (this run's tables) | ${PAGE_TESTS:-not run} |"
            echo "| Commit refreshed tables | ${COMMIT:-not run} |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Run summary
        if: always()
        env:
          OUTCOME: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            echo "## Published: $PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Publish: FAILED. The last good page stays live." >> "$GITHUB_STEP_SUMMARY"
          fi

  # The weekly league-chat post (config.yaml chat.mode: "off", "dry-run", or "on"; docs/RUNBOOK.md section 7).
  # Runs only after the page is published. Each week is posted at most once: it is recorded in
  # data/chat_posts.csv and pushed *before* the message is sent, so a rerun or the Thursday run skips it.
  # The GroupMe bot ID is the one approved secret (CLAUDE.md rule 7), passed only to the steps that need it.
  post:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # record the posted week in data/chat_posts.csv
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }} # the latest commit, including this run's refreshed tables

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install
        run: |
          pip install -r requirements-ci.txt
          pip install --no-deps -e .

      # Prints the message in a dry run; decides whether this week still needs posting.
      - name: Chat post (decide)
        id: claim
        env:
          GROUPME_BOT_ID: ${{ secrets.GROUPME_BOT_ID }} # only checked for presence here
        run: python -m sleeper_dash.chat claim

      - name: Record the week before sending
        if: steps.claim.outputs.send == 'true'
        env:
          WEEK: ${{ steps.claim.outputs.week }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/chat_posts.csv
          git commit -m "Chat post: week $WEEK"
          git pull --rebase
          git push

      - name: Send to the league chat
        id: send
        if: steps.claim.outputs.send == 'true'
        env:
          GROUPME_BOT_ID: ${{ secrets.GROUPME_BOT_ID }}
        run: python -m sleeper_dash.chat send

      # The send failed after the week was recorded: un-record it so the next run tries again.
      - name: Un-record after a failed send
        if: failure() && steps.send.outcome == 'failure'
        env:
          WEEK: ${{ steps.claim.outputs.week }}
        run: |
          python -m sleeper_dash.chat release
          git add data/chat_posts.csv
          git commit -m "Chat post failed: week $WEEK un-recorded for the next run"
          git pull --rebase
          git push
