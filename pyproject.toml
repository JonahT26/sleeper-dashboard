[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sleeper-dash"
version = "0.1.0"
description = "Automated weekly power rankings and analytics for our Sleeper fantasy football league"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "pandas",
    "pyarrow",
    "pyyaml",
    "scipy",
    "plotly",
    "jinja2",
    "pytest",
    "jupyterlab",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sleeper_dash.dashboard" = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
